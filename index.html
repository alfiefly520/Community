const timeline = document.getElementById('timeline');
let counter = 0;

data.forEach(phase => {
  const phaseEl = document.createElement('section');
  phaseEl.className = 'phase';

  const titleEl = document.createElement('h2');
  titleEl.className = 'phase-title';
  titleEl.textContent = phase.phase;
  phaseEl.appendChild(titleEl);

  phase.events.forEach(ev => {
    counter++;
    const evEl = document.createElement('article');
    evEl.className = 'event';

    const header = document.createElement('div');
    header.className = 'event-header';
    const num = document.createElement('span');
    num.className = 'event-num';
    num.textContent = counter;
    header.appendChild(num);
    if (ev.time) {
      const t = document.createElement('span');
      t.className = 'event-time';
      t.textContent = ev.time;
      header.appendChild(t);
    }

    const imagesEl = document.createElement('div');
    imagesEl.className = 'event-images' + (ev.images.length === 1 ? ' single' : '');
    ev.images.forEach(src => {
      const img = document.createElement('img');
      img.src = src;
      img.loading = 'lazy';
      img.dataset.full = src;
      imagesEl.appendChild(img);
    });

    const descEl = document.createElement('div');
    descEl.className = 'event-desc';
    descEl.textContent = ev.description;

    evEl.appendChild(header);
    evEl.appendChild(imagesEl);
    evEl.appendChild(descEl);
    phaseEl.appendChild(evEl);
  });

  timeline.appendChild(phaseEl);
});

const lightbox = document.getElementById('lightbox');
const lightboxImg = document.getElementById('lightboxImg');
document.querySelectorAll('.event-images img').forEach(img => {
  img.addEventListener('click', () => {
    lightboxImg.src = img.dataset.full;
    lightbox.classList.add('active');
  });
});
lightbox.addEventListener('click', () => lightbox.classList.remove('active'));
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') lightbox.classList.remove('active');
});
</script>
</body>
</html>
